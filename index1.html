<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample E-Commerce Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }

    /* Header */
    header {
      background: #333;
      color: #fff;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Products */
    .products {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px;
      flex-wrap: wrap;
    }

    .product {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      width: 200px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
    }

    .product img {
      width: 100%;
      border-radius: 8px;
    }

    .product button {
      margin-top: 10px;
      padding: 8px 12px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .product button:hover {
      background: #218838;
    }

    /* Cart */
    .cart-details {
      margin: 30px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>My E-Shop</h1>
    <nav>
      <a href="#" onclick="showCategory('all')">Home</a>
      <a href="#" onclick="showCategory('dresses')">Dresses</a>
    </nav>
    <div class="cart">
      🛒 Cart: <span id="cart-count">0</span> items | $<span id="cart-total">0</span>
    </div>
  </header>

  <!-- Product List -->
  <section class="products">
    <!-- Default Products -->
    <div class="product" data-category="all">
      <img src="https://via.placeholder.com/150" alt="Product 1">
      <h3>Product 1</h3>
      <p>$20</p>
      <button onclick="addToCart('Product 1', 20)">Add to Cart</button>
    </div>

    <div class="product" data-category="all">
      <img src="https://via.placeholder.com/150" alt="Product 2">
      <h3>Product 2</h3>
      <p>$35</p>
      <button onclick="addToCart('Product 2', 35)">Add to Cart</button>
    </div>

    <!-- Dresses Category -->
    <div class="product" data-category="dresses">
      <img src="https://via.placeholder.com/150/FF69B4/000000?text=Dress+1" alt="Dress 1">
      <h3>Red Party Dress</h3>
      <p>$50</p>
      <button onclick="addToCart('Red Party Dress', 50)">Add to Cart</button>
    </div>

    <div class="product" data-category="dresses">
      <img src="https://via.placeholder.com/150/9370DB/000000?text=Dress+2" alt="Dress 2">
      <h3>Evening Gown</h3>
      <p>$70</p>
      <button onclick="addToCart('Evening Gown', 70)">Add to Cart</button>
    </div>
  </section>

  <!-- Cart Details -->
  <section class="cart-details">
    <h2>Cart Details</h2>
    <ul id="cart-items"></ul>
  </section>

  <script>
    let cart = [];
    let total = 0;

    function addToCart(product, price) {
      cart.push({ product, price });
      total += price;

      document.getElementById("cart-count").innerText = cart.length;
      document.getElementById("cart-total").innerText = total;
      displayCart();
    }

    function displayCart() {
      let cartList = document.getElementById("cart-items");
      cartList.innerHTML = "";

      cart.forEach((item, index) => {
        let li = document.createElement("li");
        li.textContent = `${item.product} - $${item.price}`;
        
        let removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove";
        removeBtn.style.marginLeft = "10px";
        removeBtn.onclick = () => removeFromCart(index);

        li.appendChild(removeBtn);
        cartList.appendChild(li);
      });
    }

    function removeFromCart(index) {
      total -= cart[index].price;
      cart.splice(index, 1);

      document.getElementById("cart-count").innerText = cart.length;
      document.getElementById("cart-total").innerText = total;
      displayCart();
    }

    function showCategory(category) {
      let products = document.querySelectorAll(".product");
      products.forEach(p => {
        if (category === "all" || p.getAttribute("data-category") === category) {
          p.style.display = "block";
        } else {
          p.style.display = "none";
        }
      });
    }
  </script>
</body>
</html>
