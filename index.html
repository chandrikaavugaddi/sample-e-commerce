<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample E-Commerce Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <h1>My E-Shop</h1>
    <div class="cart">
      🛒 Cart: <span id="cart-count">0</span> items | $<span id="cart-total">0</span>
    </div>
  </header>

  <!-- Product List -->
  <section class="products">
    <div class="product">
      <img src="shoe1.jfif" alt="Product 1">
      <h3>Product 1</h3>
      <p>$20</p>
      <button onclick="addToCart('Product 1', 20)">Add to Cart</button>
    </div>

    <div class="product">
      <img src="shoe2.jfif" alt="Product 2">
      <h3>Product 2</h3>
      <p>$35</p>
      <button onclick="addToCart('Product 2', 35)">Add to Cart</button>
    </div>

    <div class="product">
      <img src="shoe3.jfif" alt="Product 3">
      <h3>Product 3</h3>
      <p>$15</p>
      <button onclick="addToCart('Product 3', 15)">Add to Cart</button>
    </div>
  </section>

  <!-- Cart Details -->
  <section class="cart-details">
    <h2>Cart Details</h2>
    <ul id="cart-items"></ul>
  </section>

  <script src="script.js"></script>
  <a hrf="index1,html>Clothes</a>
</body>
</html>
